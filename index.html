<body class="bg-slate-50 min-h-screen">

        <!-- Start Screen -->
        <div id="start-screen" class="flex-1 flex flex-col justify-center items-center text-center">

                <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>

            <h1 class="text-3xl font-bold text-slate-800 mb-2">Unit 3 Quiz</h1>
            <p class="text-slate-500 mb-8 font-medium italic">Blockchain Technology (150 MCQs)</p>

    <script>
        const questions = [
            
  // ── 1. Basics & Definition ─────────────────────────────────────────────────
  { q: "What is Blockchain?", options: ["A centralized database controlled by a single authority", "A decentralized, distributed digital ledger that records and verifies transactions securely across a peer-to-peer network", "A cloud storage service", "A type of programming language"], a: 1, e: "Blockchain is a decentralized, distributed digital ledger that records and verifies transactions in a secure and transparent way across a peer-to-peer network of computers called nodes." },
 
  { q: "How does blockchain store information?", options: ["In a single central server", "In relational tables", "In chronologically ordered blocks that are cryptographically linked together", "In plain text files"], a: 2, e: "Blockchain stores information in chronologically ordered blocks that are linked together, forming an immutable and transparent record that cannot be altered without consensus from the network participants." },
 
  { q: "The network of computers that maintain a blockchain is called:", options: ["Servers", "Clients", "Nodes", "Hubs"], a: 2, e: "The blockchain is maintained across a peer-to-peer network of computers called nodes, each holding a copy of the distributed ledger." },
 
  { q: "Which of the following is NOT a key feature of blockchain?", options: ["Decentralization", "Immutability", "Volatility", "Transparency"], a: 2, e: "The key features of blockchain are decentralization, immutability, transparency, security, distributed ledger, and smart contracts. Volatility is a market characteristic, not a blockchain feature." },
 
  { q: "Blockchain's immutability means:", options: ["Data can be updated by the admin", "Once a block is added it cannot be altered or deleted", "Data is stored in one central location", "Transactions can be reversed by participants"], a: 1, e: "Immutability means once a block of transactions is added to the blockchain, it cannot be altered or deleted, ensuring the integrity and reliability of the recorded data." },
 
  { q: "Blockchain's transparency feature means:", options: ["Only the admin can view the ledger", "All participants can view the ledger, creating an auditable trail", "Transactions are hidden from all users", "Only the sender and receiver can see a transaction"], a: 1, e: "Transparency means all participants on a blockchain network can view the ledger, which contains a record of all transactions, promoting trust among network users." },
 
  { q: "Decentralization in blockchain means:", options: ["A single server controls all data", "Data is distributed across a network of computers, preventing single point of failure", "Only one organization manages the data", "All data is stored in one geographic location"], a: 1, e: "Decentralization means instead of a single central server, data is distributed across a network of computers (nodes), preventing a single point of failure and making the network more resistant to attacks." },
 
  { q: "Which cryptographic technique is used in blockchain to secure data within each block and link blocks together?", options: ["Encryption only", "Hashing", "Base64 encoding", "SSL certificates"], a: 1, e: "Cryptographic algorithms like hashing are used to secure data within each block and link blocks together, making them virtually impossible to tamper with." },
 
  { q: "Smart Contracts in blockchain are best described as:", options: ["Physical contracts scanned into digital format", "Self-executing contracts with agreement terms written into code that automatically execute when predefined conditions are met", "Legal documents signed digitally", "Contracts stored in a central server"], a: 1, e: "Smart Contracts are self-executing contracts with the terms of the agreement directly written into code. They automatically execute actions when predefined conditions are met, reducing the need for intermediaries." },
 
  { q: "In blockchain, a Distributed Ledger means:", options: ["A ledger stored on one computer", "A shared, synchronized database spread across all computers on the network, with every node holding a copy", "A ledger maintained by a central bank", "A spreadsheet shared via email"], a: 1, e: "The blockchain is a distributed ledger — a shared, synchronized database spread across all computers on the network, with every node holding a copy." },
 
  // ── 2. Traditional vs Blockchain ──────────────────────────────────────────
  { q: "How does blockchain architecture differ from traditional systems?", options: ["Blockchain is centralized; traditional systems are decentralized", "Blockchain is decentralized; traditional systems are centralized", "Both are equally centralized", "Both are equally decentralized"], a: 1, e: "Traditional systems have a centralized architecture, while blockchain systems are decentralized — data is stored across multiple nodes rather than a single central server or database." },
 
  { q: "In traditional systems, data modification allows:", options: ["Only appending new data", "Add, update, and delete operations", "No data modification at all", "Only reading data"], a: 1, e: "Traditional systems allow add, update, and delete operations on data, whereas blockchain is append-only and past data cannot be altered." },
 
  { q: "Trust in blockchain systems is built through:", options: ["Trusted third parties like banks and notaries", "Cryptography and consensus mechanisms", "Government regulations", "Central authority decisions"], a: 1, e: "Unlike traditional systems that require trusted third parties (banks, intermediaries, notaries), blockchain builds trust through cryptography and consensus mechanisms." },
 
  { q: "In terms of transparency, which statement is correct?", options: ["Traditional systems are highly transparent to all", "Blockchain has limited transparency", "Traditional systems have limited visibility (only to authorized entities); blockchain allows all participants to verify transactions", "Both have equal transparency"], a: 2, e: "Traditional systems have limited transparency — data is visible only to authorized entities. Blockchain has high transparency — all participants can verify transactions (in public blockchains)." },
 
  { q: "Which is an example of a traditional centralized system?", options: ["Bitcoin", "Ethereum", "Banks and traditional ledgers", "Hyperledger Fabric"], a: 2, e: "Banks, traditional ledgers, and centralized cloud systems are examples of traditional centralized systems, as opposed to blockchain examples like Bitcoin and Ethereum." },
 
  { q: "Why can traditional systems be faster for large transaction volumes?", options: ["Because they use more nodes", "Because they avoid consensus mechanisms and intermediary delays", "Because they use blockchain", "Because they have no security"], a: 1, e: "Traditional systems are generally faster for large volumes because they avoid the overhead of consensus mechanisms. However, blockchain intermediaries actually add delays in some cases (e.g., bank transfers taking days)." },
 
  // ── 3. Blockchain Architecture – Core Components ──────────────────────────
  { q: "What are Nodes in a blockchain?", options: ["The smallest unit of data", "The computers or users that participate in the network, storing a copy of the ledger and validating transactions", "The cryptographic keys", "The smart contract programs"], a: 1, e: "Nodes are the computers or users that participate in the blockchain network. Each node stores a copy of the distributed ledger and works to validate new transactions and blocks." },
 
  { q: "What are Transactions in blockchain?", options: ["The blocks that store data", "The smallest building blocks of a blockchain system, representing a transfer of assets or data between parties", "The consensus rules", "The cryptographic hashes"], a: 1, e: "Transactions are the smallest building blocks of a blockchain system, representing a transfer of assets or data between parties." },
 
  { q: "What are Blocks in a blockchain?", options: ["Individual transactions", "Data structures that bundle a set of verified transactions to be distributed to all nodes", "The network nodes themselves", "The consensus algorithms"], a: 1, e: "Blocks are data structures that bundle a set of verified transactions to be distributed to all nodes in the network." },
 
  { q: "What forms the 'Chain' in blockchain?", options: ["A series of nodes connected by wires", "The chronological sequence of blocks cryptographically linked together by a unique hash, making the ledger immutable", "A network protocol", "A list of wallet addresses"], a: 1, e: "The Chain is the chronological sequence of blocks, cryptographically linked together by a unique hash, which makes the ledger immutable and tamper-proof." },
 
  { q: "Consensus Mechanisms in blockchain ensure:", options: ["Only one miner validates all transactions", "All nodes agree on the current state of the blockchain and validity of transactions", "Data can be deleted by administrators", "Transactions are processed faster"], a: 1, e: "Consensus mechanisms are a set of rules and algorithms that ensure all nodes in the network agree on the current state of the blockchain and the validity of transactions." },
 
  // ── 4. Layers of Blockchain Architecture ─────────────────────────────────
  { q: "Which blockchain architecture layer provides user-facing services like DApps, wallets, and APIs?", options: ["Data Layer", "Network Layer", "Consensus Layer", "Application Layer"], a: 3, e: "The Application Layer is the user-facing layer that provides services and applications built on blockchain, including smart contracts, DApps, APIs, wallets, exchanges, and blockchain explorers." },
 
  { q: "Uniswap, OpenSea, and MetaMask are examples of which blockchain layer?", options: ["Data Layer", "Consensus Layer", "Network Layer", "Application Layer (Ethereum DApps)"], a: 3, e: "Uniswap, OpenSea, and MetaMask are Ethereum DApps — examples of the Application Layer of blockchain architecture." },
 
  { q: "The Contract Layer in blockchain architecture is responsible for:", options: ["Storing physical infrastructure", "Containing and executing smart contracts, defining business logic, and bridging protocol-level operations with application-level functions", "Managing peer-to-peer communication", "Storing raw transaction data"], a: 1, e: "The Contract Layer contains smart contracts (self-executing code), defines business logic and rules, and bridges protocol-level operations (consensus, transactions) with application-level functions (DApps, DeFi, NFTs)." },
 
  { q: "The Ethereum Virtual Machine (EVM) is a component of which blockchain layer?", options: ["Data Layer", "Network Layer", "Infrastructure Layer", "Contract Layer"], a: 3, e: "Virtual Machines (VMs) like the Ethereum Virtual Machine (EVM) are part of the Contract Layer — they run the smart contracts." },
 
  { q: "Which programming language is used to write smart contracts on Ethereum?", options: ["Python", "Java", "Solidity", "C++"], a: 2, e: "Solidity is the programming language used for smart contracts on Ethereum. Rust is used on Solana and Move on Aptos." },
 
  { q: "The Consensus Layer in blockchain is responsible for:", options: ["Providing user interfaces", "Ensuring all nodes agree on a single valid version of the ledger, validating transactions, and preventing double spending", "Storing raw block data", "Managing peer-to-peer node discovery"], a: 1, e: "The Consensus Layer ensures all nodes agree on the same blockchain state, decides which transactions are valid, prevents double spending, provides fault tolerance, and confirms block finality (immutability)." },
 
  { q: "Proof of Work (PoW) consensus is used in:", options: ["Ethereum 2.0", "Hyperledger Fabric", "Bitcoin", "EOS"], a: 2, e: "Proof of Work (PoW) is used in Bitcoin. Miners solve cryptographic puzzles — the first to solve adds the block and earns rewards. It is secure but energy-intensive." },
 
  { q: "Proof of Stake (PoS) consensus is used in:", options: ["Bitcoin", "Hyperledger Fabric", "EOS", "Ethereum 2.0 and Cardano"], a: 3, e: "Proof of Stake (PoS) is used in Ethereum 2.0 and Cardano. Validators lock up coins (stake) and are chosen randomly to validate blocks — more energy-efficient than PoW." },
 
  { q: "Delegated Proof of Stake (DPoS) is used in:", options: ["Bitcoin", "EOS and TRON", "Ethereum 2.0", "Hyperledger Fabric"], a: 1, e: "DPoS is used in EOS and TRON. Token holders vote for a small group of delegates who validate transactions — it is faster but less decentralized." },
 
  { q: "Practical Byzantine Fault Tolerance (PBFT) is used in:", options: ["Bitcoin", "Ethereum", "Hyperledger Fabric", "Solana"], a: 2, e: "PBFT (Practical Byzantine Fault Tolerance) is used in Hyperledger Fabric, where nodes reach agreement by majority voting. It is suitable for permissioned blockchains." },
 
  { q: "The Network Layer (P2P Layer) in blockchain is responsible for:", options: ["Storing transaction data", "Executing smart contracts", "Communication and data exchange between blockchain nodes, broadcasting transactions and blocks", "Providing user interfaces"], a: 2, e: "The Network Layer is responsible for communication and data exchange between blockchain nodes — ensuring transactions and blocks are broadcast, shared, and synchronized across all participants." },
 
  { q: "The Gossip Protocol in the Network Layer is used to:", options: ["Encrypt data in blocks", "Efficiently spread transactions and blocks across nodes", "Validate smart contract code", "Store Merkle trees"], a: 1, e: "The Gossip Protocol efficiently spreads transactions and blocks across nodes in the blockchain network." },
 
  { q: "What type of node stores the entire blockchain and validates transactions/blocks?", options: ["Light Node (SPV)", "Mining Node only", "Full Node", "Validator Node only"], a: 2, e: "Full Nodes store the entire blockchain and validate transactions/blocks. Light Nodes (SPV) store only block headers and rely on full nodes for verification." },
 
  { q: "The Data Layer in blockchain contains:", options: ["User application code", "The actual storage of transactions in blocks, including hashing, digital signatures, and Merkle trees", "The consensus rules only", "The P2P communication protocols"], a: 1, e: "The Data Layer is the foundation layer of blockchain where all transactions, blocks, and cryptographic structures (hashing, digital signatures, Merkle trees) are stored." },
 
  { q: "A Merkle Tree in blockchain is used to:", options: ["Connect nodes in the P2P network", "Efficiently store transactions and quickly verify whether a transaction belongs to a block", "Store user wallet addresses", "Run smart contract code"], a: 1, e: "A Merkle Tree is a binary tree structure used to store transactions efficiently and quickly verify whether a transaction belongs to a block without downloading the entire blockchain." },
 
  { q: "Digital Signatures in the Data Layer ensure:", options: ["Data compression", "Authenticity and ownership of transactions using public-private key cryptography", "Faster block creation", "Energy efficiency"], a: 1, e: "Digital Signatures in the Data Layer verify sender authenticity and ownership of transactions using public-private key cryptography." },
 
  { q: "The Infrastructure/Hardware Layer of blockchain consists of:", options: ["Smart contracts and DApps", "The hardware, devices, and networking resources that keep the blockchain alive", "The consensus algorithms", "The user-facing application logic"], a: 1, e: "The Infrastructure Layer is the foundation of blockchain architecture consisting of hardware (nodes, mining rigs, data centers) and networking resources (P2P protocols, internet backbone) that keep the blockchain running." },
 
  // ── 5. Transaction Flow in Blockchain ────────────────────────────────────
  { q: "In the blockchain transaction flow, what is the Mempool?", options: ["The consensus mechanism", "A temporary waiting area where verified transactions are held until bundled into a block", "The final block added to the chain", "The miner's reward"], a: 1, e: "The Mempool (memory pool) is a temporary waiting area where verified transactions are held until miners select them to be bundled into a block." },
 
  { q: "In the blockchain transaction flow, what does Mining and Consensus involve?", options: ["Deleting old blocks", "Miners solving a cryptographic puzzle to earn the right to create a new block", "Users signing in to the network", "Sending private keys to others"], a: 1, e: "During Mining and Consensus, miners select transactions from the mempool and solve a complex cryptographic puzzle. The first miner to solve it wins the right to create a new block." },
 
  { q: "What happens during the Verification step in the blockchain transaction flow?", options: ["The block is permanently added to the chain", "Nodes verify the transaction's legitimacy — checking for sufficient funds and proper authorization using the sender's private key", "The transaction is sent to the mempool", "The miner is rewarded"], a: 1, e: "During Verification, nodes check the transaction's legitimacy — verifying sufficient funds and proper authorization using the sender's private key." },
 
  { q: "Once a block is added to the blockchain, it becomes:", options: ["Editable by the admin", "Temporarily stored and later deleted", "Permanently and immutably recorded, virtually impossible to alter without changing all subsequent blocks", "Visible only to the sender"], a: 2, e: "Once a block is added, it is permanently and immutably recorded — it becomes virtually impossible to alter without changing all subsequent blocks in the chain (Immutability step in transaction flow)." },
 
  // ── 6. Types of Blockchain ────────────────────────────────────────────────
  { q: "Which blockchain type is open for anyone to join, view transactions, and participate in network consensus without central authority?", options: ["Private Blockchain", "Consortium Blockchain", "Hybrid Blockchain", "Public Blockchain"], a: 3, e: "A Public Blockchain is a decentralized, open-access, permissionless distributed ledger where anyone can join, view transactions, and participate in network consensus without central authority." },
 
  { q: "Bitcoin and Ethereum are examples of which type of blockchain?", options: ["Private Blockchain", "Consortium Blockchain", "Public Blockchain", "Hybrid Blockchain"], a: 2, e: "Bitcoin and Ethereum are examples of Public Blockchains — open, permissionless, decentralized ledgers visible to everyone." },
 
  { q: "A major disadvantage of Public Blockchain is:", options: ["Limited participation", "Lack of transparency", "Slow transaction speed due to thousands of nodes verifying, and energy-intensive consensus (especially PoW)", "No support for smart contracts"], a: 2, e: "Public Blockchains are slow (thousands of nodes verifying), energy-intensive (especially PoW networks like Bitcoin), have scalability issues, and offer less privacy since data is open to everyone." },
 
  { q: "A Private Blockchain is best described as:", options: ["Open for anyone to join", "A permissioned, closed network run by a single organization where participants must be explicitly granted access", "Controlled by multiple organizations jointly", "A combination of public and private features"], a: 1, e: "A Private Blockchain is a permissioned, closed network run by a single organization or consortium, where participants must be explicitly granted access — suited for businesses requiring confidentiality and control." },
 
  { q: "Which consensus mechanisms are commonly used in Private Blockchains?", options: ["Proof of Work (PoW)", "Proof of Stake (PoS)", "PBFT, RAFT, and Proof of Authority (PoA)", "Delegated Proof of Stake (DPoS)"], a: 2, e: "Private blockchains use efficient consensus mechanisms like PBFT (Practical Byzantine Fault Tolerance), RAFT, and Proof of Authority (PoA) — lightweight, enterprise-friendly protocols suited for fewer, known participants." },
 
  { q: "Hyperledger Fabric and R3 Corda are examples of:", options: ["Public Blockchains", "Consortium Blockchains", "Private Blockchains", "Hybrid Blockchains"], a: 2, e: "Hyperledger Fabric (by Linux Foundation) and R3 Corda (used in banking/finance) are examples of Private Blockchains." },
 
  { q: "A key disadvantage of Private Blockchain is:", options: ["Slow transaction speed", "High energy consumption", "Centralization — trust still lies in one organization, not fully decentralized", "Too many nodes"], a: 2, e: "A key disadvantage of Private Blockchain is Centralization — trust still lies in one organization, it is not fully decentralized, which reduces the trustless nature of blockchain." },
 
  { q: "A Consortium Blockchain is controlled by:", options: ["Anyone on the internet", "A single organization only", "A group of pre-selected organizations that jointly manage the network", "An anonymous set of miners"], a: 2, e: "A Consortium Blockchain is a permissioned blockchain where a group of pre-selected organizations jointly controls the network — sharing the responsibility for validating transactions and maintaining integrity." },
 
  { q: "R3 Corda with 200+ financial institutions is an example of which blockchain type?", options: ["Public Blockchain", "Private Blockchain", "Consortium Blockchain", "Hybrid Blockchain"], a: 2, e: "R3 Corda (consortium of 200+ financial institutions) and Hyperledger Fabric (used by multiple enterprises) are examples of Consortium Blockchains." },
 
  { q: "How does a Consortium Blockchain differ from a Private Blockchain?", options: ["Consortium is open to everyone; private is closed", "Consortium is controlled by multiple organizations (semi-decentralized); private is controlled by a single organization", "They are identical", "Private uses PoW; consortium uses PoS"], a: 1, e: "Consortium Blockchain is controlled by multiple organizations (semi-decentralized), while Private Blockchain is controlled by a single organization — making consortium more decentralized than private but less than public." },
 
  { q: "A Hybrid Blockchain combines features of:", options: ["Public and Consortium blockchains only", "Private and Consortium blockchains only", "Public (open, permissionless) and Private (permission-based, closed) blockchains", "Only Consortium and Private"], a: 2, e: "A Hybrid Blockchain combines features from both public blockchains (open and permissionless) and private blockchains (permission-based and closed) to create a system that is both transparent and private." },
 
  { q: "Dragonchain (by Disney) and XinFin (XDC Network) are examples of which blockchain type?", options: ["Public Blockchain", "Private Blockchain", "Consortium Blockchain", "Hybrid Blockchain"], a: 3, e: "Dragonchain (by Disney) and XinFin (XDC Network) are examples of Hybrid Blockchains." },
 
  { q: "IBM Food Trust (mix of private tracking with public auditability) is an example of:", options: ["Public Blockchain", "Private Blockchain", "Consortium Blockchain", "Hybrid Blockchain"], a: 3, e: "IBM Food Trust uses a Hybrid Blockchain — combining private tracking of supply chain data with public auditability." },
 
  { q: "What is a key advantage of a Hybrid Blockchain?", options: ["Fully public and transparent", "Fully private with no visibility", "Keeps sensitive data private while sharing proof publicly, with flexibility to control what to disclose", "No use of smart contracts"], a: 2, e: "A key advantage of Hybrid Blockchain is that it keeps sensitive data private while sharing proof publicly, with flexibility for organizations to control what to disclose and what to hide." },
 
  // ── 7. Blockchain Applications ────────────────────────────────────────────
  { q: "What is DeFi in the context of blockchain in finance?", options: ["Decentralized Filing", "Decentralized Finance — using blockchain and smart contracts to offer financial services like lending, borrowing, and trading without traditional financial institutions", "Digital Fiat infrastructure", "Distributed File system"], a: 1, e: "DeFi (Decentralized Finance) uses blockchain and smart contracts to offer financial services like lending, borrowing, and trading without traditional financial institutions — accessible to anyone with internet access." },
 
  { q: "RippleNet and Stellar Lumens (XLM) are used for which blockchain finance application?", options: ["Insurance", "Securities Issuance", "Cross-Border Transactions and Remittances", "Trade Finance"], a: 2, e: "RippleNet and Stellar Lumens (XLM) facilitate Cross-Border Transactions and Remittances — faster, cheaper, and more transparent international payments by removing intermediaries." },
 
  { q: "Central Bank Digital Currencies (CBDCs) like Digital Yuan and eNaira are examples of blockchain in:", options: ["Gaming", "Healthcare", "Supply Chain", "Finance"], a: 3, e: "CBDCs (Central Bank Digital Currencies) like Digital Yuan (China), Sand Dollar (Bahamas), and eNaira (Nigeria) are blockchain-based Finance applications where countries develop digital versions of their fiat currencies." },
 
  { q: "KYC and AML compliance in finance is improved by blockchain through:", options: ["Smart Contract automation", "Digital Identity Management", "NFT creation", "Cross-game asset trading"], a: 1, e: "Blockchain enhances Digital Identity Management, improving Know Your Customer (KYC) and Anti-Money Laundering (AML) compliance processes in finance." },
 
  { q: "Which blockchain platform in Finance is used for DeFi lending?", options: ["Medicalchain", "TradeLens", "Aave", "Modum"], a: 2, e: "Aave is an example of a DeFi lending platform — one of the Finance applications of blockchain. Uniswap (DEX) and MakerDAO (stablecoins) are other DeFi examples." },
 
  { q: "Medicalchain and BurstIQ are examples of blockchain in:", options: ["Finance", "Gaming", "Healthcare (EHR Management)", "Supply Chain"], a: 2, e: "Medicalchain and BurstIQ are examples of blockchain used in Healthcare for Electronic Health Records (EHR) Management — providing secure, decentralized patient data with interoperability." },
 
  { q: "Blockchain in Healthcare helps combat counterfeit drugs through:", options: ["DeFi protocols", "Pharmaceutical Supply Chain tracking — ensuring authenticity and origin from manufacturer to patient", "NFT gaming assets", "Cross-border payments"], a: 1, e: "Blockchain in Healthcare's Pharmaceutical Supply Chain application ensures drug traceability — tracking medications from manufacturer to patient to combat counterfeit drugs." },
 
  { q: "Nebula Genomics is an example of blockchain used for:", options: ["Gaming NFTs", "Personalized Medicine and Genomics — secure storage and management of DNA/genomic data", "Cross-border payments", "Smart supply chain contracts"], a: 1, e: "Nebula Genomics uses blockchain for Personalized Medicine and Genomics — supporting secure storage and management of sensitive DNA/genomic data for personalized treatment plans." },
 
  { q: "In blockchain supply chain, IBM Food Trust is used by Walmart to:", options: ["Issue digital currencies", "Track food freshness and product provenance", "Mint NFTs for gaming", "Process insurance claims"], a: 1, e: "IBM Food Trust (used by Walmart) is an example of Enhanced Traceability and Transparency in blockchain supply chain — tracking food freshness and the complete product journey." },
 
  { q: "TradeLens (IBM + Maersk) is an example of blockchain in supply chain for:", options: ["Drug traceability", "Smart Contracts for Automation — triggering payments when a shipment reaches a specific location", "Gaming economies", "EHR management"], a: 1, e: "TradeLens (IBM + Maersk) uses Smart Contracts to automate supply chain operations, such as triggering payments when a shipment reaches a specific location or verifying compliance." },
 
  { q: "Which blockchain supply chain application allows consumers to scan a QR code to view a product's full history?", options: ["Fraud Prevention", "Automated Compliance", "Enhanced Consumer Engagement", "Streamlined Supplier Onboarding"], a: 2, e: "Enhanced Consumer Engagement allows consumers to scan a QR code on a product to access its detailed history on the blockchain — learning about its origin, materials, and carbon footprint." },
 
  { q: "In blockchain gaming, NFTs stand for:", options: ["Network File Tokens", "Non-Fungible Tokens — unique tokens representing in-game items, characters, and digital assets", "Network Function Tags", "New Financial Tools"], a: 1, e: "NFTs (Non-Fungible Tokens) are unique blockchain tokens that represent in-game items, characters, and other digital assets, giving players true ownership of in-game assets." },
 
  { q: "The Play-to-Earn (P2E) model in blockchain gaming means:", options: ["Players pay to access all content", "Gamers earn tokens or NFTs with real-world value by playing games", "Games are free but have no rewards", "Only developers earn money"], a: 1, e: "Play-to-Earn (P2E) means gamers can earn real-world value by playing games — breeding, training, or selling in-game assets for cryptocurrency or fiat money." },

  { q: "Bitcoin (BTC) is often called:", options: ["Digital silver", "Digital gold — the oldest and largest cryptocurrency by market cap with a finite supply of 21 million", "A stablecoin", "A DeFi token"], a: 1, e: "Bitcoin is often called 'digital gold' — it is the oldest and largest cryptocurrency by market cap, with a finite supply of 21 million BTC." },

  { q: "Which blockchain challenge refers to blockchains handling far fewer transactions per second compared to Visa or Mastercard?", options: ["Energy Consumption", "Regulatory Uncertainty", "Scalability", "Interoperability"], a: 2, e: "Scalability is a major challenge — blockchains like Bitcoin and Ethereum handle far fewer TPS compared to Visa or Mastercard. As users grow, network congestion, slower speeds, and higher fees become problems." },

  { q: "High gas fees in Ethereum are an example of which blockchain challenge?", options: ["Regulatory Uncertainty", "Data Privacy", "High Implementation Costs — transaction fees becoming very expensive", "Interoperability"], a: 2, e: "High Implementation Costs is a blockchain challenge — transaction fees (like Ethereum gas fees) can become very expensive, limiting blockchain's use in small transactions or everyday payments." },

  { q: "DeFi rug pulls are an example of which blockchain challenge?", options: ["Energy Consumption", "Scalability", "Security Risks — including rug pulls, phishing, and wallet hacks in DeFi", "Interoperability"], a: 2, e: "Security Risks in blockchain include 51% attacks, double spending, phishing, and rug pulls in DeFi — where developers abandon a project and take investor funds." },
    ];

        let currentIdx = 0, score = 0, answered = false;

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            const totalQuestions = questions.length;
            document.getElementById('progress-text').innerText = `Question 1/${totalQuestions}`;
            document.getElementById('final-total').innerText = `Correct out of ${totalQuestions}`;
            
            // Randomize options for each question initially
            questions.forEach(q => {
                const originalCorrect = q.options[q.a];
                
                // Fisher-Yates shuffle for options
                for (let i = q.options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
                }
                
                // Find new index of the correct answer
                q.a = q.options.indexOf(originalCorrect);
            });

            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            const totalQuestions = questions.length;
            
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('progress-text').innerText = `Question ${currentIdx + 1}/${totalQuestions}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / totalQuestions) * 100}%`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-blue-200 hover:bg-blue-50 font-medium text-sm text-slate-700 transition-all";
                btn.innerText = opt;
                btn.onclick = () => selectOption(i, btn);
                container.appendChild(btn);
            });
            
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            answered = false;
        }

        function selectOption(idx, btn) {
            if (answered) return;
            answered = true;
            
            const q = questions[currentIdx];
            const allBtns = document.querySelectorAll('#options-container button');
            
            if (idx === q.a) {
                score++;
                btn.classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                document.getElementById('score-text').innerText = `Score: ${score}`;
            } else {
                btn.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                allBtns[q.a].classList.add('border-green-500', 'bg-green-50', 'text-green-700');
            }
            
            const exp = document.getElementById('explanation-box');
            exp.innerHTML = `<strong>Explanation:</strong> ${q.e}`;
            exp.classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
            }
        }
    </script>
